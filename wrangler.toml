name = "secure-delivery"
main = "worker.js"
compatibility_date = "2025-01-01"

# ── R2 bucket that holds your downloadable files ──────────────────────────────
[[r2_buckets]]
binding = "ASSETS"
bucket_name = "product-files"

# ── YOUR live settings — edit values HERE; they survive every rebuild ─────────
# (Values set only in the dashboard get reset on the next build, so the real
#  config lives in this file.)
[vars]
ALLOWED_ORIGIN = "https://simple-product-listing.framer.website"
TOKEN_TTL_MINUTES = "1440"

# FREE template
FREE_PRODUCT_KEY = "Fitness_Wellness_Template_Overview.pdf"
FREE_PRODUCT_FILENAME = "Fitness_Wellness_Template_Overview.pdf"
FREE_PRODUCT_NAME = "Fitness Wellness Template Overview"

# PAID template — using the existing file for now so you can test; swap
# PAID_PRODUCT_KEY to your real paid file once it's uploaded to product-files.
PAID_PRODUCT_KEY = "Fitness_Wellness_Template_Overview.pdf"
PAID_PRODUCT_FILENAME = "Wellness-Yoga-Journey.pdf"
PAID_PRODUCT_NAME = "Wellness Yoga Journey by Tara"
PAID_PRICE = "19"
PAID_CURRENCY = "usd"
SUCCESS_URL = "https://simple-product-listing.framer.website/thank-you"
CANCEL_URL = "https://simple-product-listing.framer.website/paid"

SENDER_NAME = "Passion Project With Yeonny"
SENDER_EMAIL = "yeonny@passion-project-with-yeonny.com"

# ── SECRETS (set in the Cloudflare dashboard, never here) ─────────────────────
#   TOKEN_SIGNING_SECRET   — signs download tokens (set at deploy; persists)
#   STRIPE_SECRET_KEY      — sk_test_… / sk_live_… (required for paid checkout)
#   STRIPE_WEBHOOK_SECRET  — whsec_… (optional, for the backup email)
#   BREVO_API_KEY          — optional (email delivery / contact capture)
